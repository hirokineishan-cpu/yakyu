<title>野球記録</title>
<!-- 起動を早くするための2つ。
     ・前回開いていたタブの部品を、この時点で取りに行かせる（外枠の解析を待たない）
     ・スプレッドシートとの接続も先に張っておく（最初の通信が速くなる） -->
<script>
(function () {
  var t = '';
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('hsp-tab-') === 0) { t = localStorage.getItem(k) || ''; break; }
    }
  } catch (e) {}
  var f = { analysis: 'analysis', physical: 'physical', trackman: 'trackman', session: 'session', me: 'me' }[t] || 'record';
  var l = document.createElement('link');
  l.rel = 'modulepreload'; l.href = './mod-' + f + '.js';
  document.head.appendChild(l);
})();
</script>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="manifest" href="./manifest.json">

<style>
/* ==== 共通（両アプリから持ち上げた配色と土台） ==== */
:root{
  --ink:#152029; --ink2:#3d4b54; --muted:#6d7c82;
  --paper:#ffffff; --ground:#e7ece8; --raise:#f3f7f3; --line:#c9d3cd;
  --grass:#2e6b4a; --grassDeep:#1f4e36; --claySoft:#e6cdc0; --clay:#b4552f;
  --strike:#b4552f; --ball:#2b6699; --foul:#a8790c; --inplay:#2e6b4a;
  --accent:#2e6b4a; --accentInk:#ffffff;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

    --strike:#d8794f; --ball:#5f9fd0; --foul:#d2a63d; --inplay:#4e9e73;
    --accent:#4e9e73; --accentInk:#0e1615;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.28);
  }}
:root[data-theme="dark"]{
  --ink:#e7eee9; --ink2:#b6c3bb; --muted:#8a9a91;
  --paper:#18211f; --ground:#0e1615; --raise:#212c29; --line:#2e3d38;
  --grass:#4e9e73; --grassDeep:#2b5f45; --claySoft:#4a3128; --clay:#d8794f;
  --strike:#d8794f; --ball:#5f9fd0; --foul:#d2a63d; --inplay:#4e9e73;

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.28);
}

  --paper:#ffffff; --ground:#e7ece8; --raise:#f3f7f3; --line:#c9d3cd;
  --grass:#2e6b4a; --grassDeep:#1f4e36; --claySoft:#e6cdc0; --clay:#b4552f;

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.28);

*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--jp); font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%}
@page{size:A4; margin:11mm}
html.prt,html.prt[data-theme="dark"]{ color-scheme:light;
  --ink:#152029; --ink2:#3d4b54; --muted:#6d7c82; --paper:#ffffff; --ground:#ffffff; --raise:#f3f7f3; --line:#c9d3cd;
  --grass:#2e6b4a; --grassDeep:#1f4e36; --claySoft:#e6cdc0; --clay:#b4552f; --accent:#2e6b4a; --accentInk:#ffffff;
  --hit:#1e8a4c; --out:#8d9aa0; --foul:#a8790c; --heat0:#fbf1ea; --heat1:#e9a67f; --heat2:#b4552f; --heat3:#5e2812; --bar:#2b6699; --shadow:none;
  --t1:#2a78d6; --t2:#eb6834; --t3:#1baf7a; --t4:#eda100; --t5:#e87ba4; --t6:#008300; --t7:#4a3aa7; --t8:#e34948; --t0:#8d9aa0; }
@media print{body{background:#fff; color:#152029}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ==== 外枠 ==== */
:root{ --barH:44px }
/* 記録タブだけは画面ぴったりの固定レイアウト（自分で中身をスクロールさせる）。
   解析・フィジカルは普通に画面ごとスクロールさせる。 */
body.t-record{ overflow:hidden }
#bar{
  position:fixed; top:0; left:0; right:0; height:var(--barH); z-index:300;
  display:flex; align-items:stretch; gap:0;
  background:var(--grassDeep); color:#fff;
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 rgba(0,0,0,.18);
}
#bar .tt{
  display:flex; align-items:center; padding:0 12px; font-weight:700; font-size:13px;
  letter-spacing:.04em; white-space:nowrap; opacity:.92;
}
#bar nav{ display:flex; min-width:0 }
#bar button{
  min-width:0; appearance:none; border:0; background:transparent; color:#fff;
  font:inherit; font-size:13.5px; font-weight:600; letter-spacing:.03em;
  padding:0 20px; cursor:pointer; position:relative; opacity:.62;
  border-radius:0; transition:opacity .12s; white-space:nowrap;
}
#bar button:hover{ opacity:.85 }
#bar button[aria-selected="true"]{ opacity:1 }
#bar button[hidden]{ display:none }
#bar button .sm{ display:none }
#bar button[aria-selected="true"]::after{
  content:""; position:absolute; left:10%; right:10%; bottom:0; height:3px;
  background:#fff; border-radius:3px 3px 0 0;
}
#bar button:focus-visible{ outline:2px solid #fff; outline-offset:-3px }
main{ margin-top:calc(var(--barH) + env(safe-area-inset-top)) }
main > section[hidden]{ display:none !important }
#boot{ padding:28px 18px; color:var(--muted); font-size:13px; text-align:center }
#boot b{ display:block; color:var(--ink); font-size:14px; margin-bottom:6px }

@media (max-width:560px){
  /* タブが4つになったので、スマホでは文字を少し詰めて重ならないようにする */
  #bar .tt{ padding:0 8px; font-size:11.5px; max-width:26vw; overflow:hidden; text-overflow:ellipsis }
  #bar nav{ flex:1 }
  #bar button{ flex:1; padding:0 2px; font-size:12px; letter-spacing:0 }
}
@media (max-width:370px){
  #bar .tt{ display:none }
}
/* タブが5つのとき（強化・管理）：スマホではチーム名を隠し、「セッション記録」は短く */
@media (max-width:560px){
  #bar.many .tt{ display:none }
  #bar.many button{ font-size:11.5px; padding:0 1px }
  #bar button .lg{ display:none }
  #bar button .sm{ display:inline }
}
@media (min-width:561px) and (max-width:760px){
  #bar.many button{ padding:0 10px }
}
/* スマホ横向き：高さが足りないので、タブバーを細くし、記録画面の球速パッドを1段にする
   （結果ボタンが球速パッドに重ならないように） */
@media (max-height:520px) and (orientation:landscape){
  :root{ --barH:32px }
  #bar button{ font-size:12px; padding:0 14px }
  #bar .tt{ font-size:11.5px }
  #tab-record .rs-mid #pad{ grid-template-columns:repeat(12,minmax(0,1fr)) }
  #tab-record .rs-mid #pad .btn{ padding-top:5px; padding-bottom:5px }
  #tab-record #mid-t{ display:none }
}
/* 印刷のときはタブバーを出さない */
@media print{
  #bar{ display:none !important }
  main{ margin-top:0 !important }
  body.t-record{ overflow:visible }
}
html.prt #bar{ display:none !important }
html.prt main{ margin-top:0 !important }
html.prt body.t-record{ overflow:visible }
</style>
</head>
<body>

<header id="bar">
  <span class="tt" id="bar-team">野球記録</span>
  <nav role="tablist">
    <button role="tab" data-tab="record"   aria-selected="true">記録</button>
    <button role="tab" data-tab="analysis" aria-selected="false">解析</button>
    <button role="tab" data-tab="physical" aria-selected="false">フィジカル</button>
    <button role="tab" data-tab="trackman" aria-selected="false">Trackman</button>
    <button role="tab" data-tab="session"  aria-selected="false"><span class="lg">セッション記録</span><span class="sm">セッション</span></button>
    <button role="tab" data-tab="me"       aria-selected="false" hidden>マイページ</button>
  </nav>
</header>

<main>
  <section id="tab-record"></section>
  <section id="tab-analysis" hidden></section>
  <section id="tab-physical" hidden></section>
  <section id="tab-trackman" hidden></section>
  <section id="tab-session" hidden></section>
  <section id="tab-me" hidden></section>
  <div id="boot"><b>読み込んでいます…</b>しばらく待っても変わらないときは、画面を下に引いて更新してください。</div>
</main>

<script type="module">
/* 外枠：設定を配り、タブに応じて部品を読み込むだけ。記録や解析の中身には関与しない。 */
const CFG = {
  TEAM_ID:"aomoriyamada",
  TEAM_NAME:"青森山田高校",
  APP_URL_B64:"aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4RktKYkwyd1pmQngzaGFucmRqUllHSUZVXzczOHFxNndEVkZGWTh3ZFZEc1FveXRtZzAwYUxYNmxHZndSRHVyZ3gvZXhlYw==",
  MIGRATE_LEGACY:false,
  STORE:""            /* 試験中だけ "-t" などを入れて、本番の保存領域と分ける */
};
const CORE = {
  cfg: CFG,
  barH: () => (document.getElementById('bar')?.offsetHeight || 0)
};

const FILES = { record:'./mod-record.js', analysis:'./mod-analysis.js', physical:'./mod-physical.js', trackman:'./mod-trackman.js', session:'./mod-session.js', me:'./mod-me.js' };
const TABKEY = 'hsp-tab-' + CFG.TEAM_ID + CFG.STORE;
const loaded = {};
const boot = document.getElementById('boot');
if (CFG.TEAM_NAME) document.getElementById('bar-team').textContent = CFG.TEAM_NAME;

/* だれがログインしているかで、出すタブを決める（中身はサーバー側でも断っている）。
     スタッフ（管理・強化）… 記録・解析・フィジカル・Trackman・セッション記録
     記録・閲覧／未ログイン … 記録・解析
     選手                  … 自分の Trackman・フィジカル・セッション記録・マイページ
     選手用のリンク（…/#me）で開いて、まだログインしていない … マイページ（ログイン）だけ
   ログインし直したときにも合うように、ときどき見直す。 */
const CONN_KEY = 'hsp-conn-' + CFG.TEAM_ID + CFG.STORE;
const PLINK_KEY = 'hsp-plink-' + CFG.TEAM_ID + CFG.STORE;
if (location.hash === '#me') { try { localStorage.setItem(PLINK_KEY, '1'); } catch(e){} }
const TABS = { staff:['record','analysis','physical','trackman','session'], user:['record','analysis'],
               player:['trackman','physical','session','me'], pguest:['me'] };
function roleNow(){
  try { const c = JSON.parse(localStorage.getItem(CONN_KEY) || 'null'); return String(c && c.token && c.user && c.user.role || ''); } catch(e){ return ''; }
}
function modeNow(){
  const r = roleNow();
  if (r.indexOf('管理') === 0 || r.indexOf('強化') === 0) return 'staff';
  if (r.indexOf('選手') === 0) return 'player';
  if (r) return 'user';
  let pl = false; try { pl = localStorage.getItem(PLINK_KEY) === '1'; } catch(e){}
  return pl ? 'pguest' : 'user';
}
CORE.mode = modeNow;
let modeCur = null;
function applyMode(){
  const m = modeNow(); if (m === modeCur) return false;
  const was = modeCur; modeCur = m;
  /* 選手とスタッフが入れ替わったときは、読み込んだ部品を作り直すために読み直す */
  if (was && (was === 'player') !== (m === 'player') && Object.keys(loaded).length) { location.reload(); return true; }
  const vis = TABS[m];
  document.querySelectorAll('#bar button[data-tab]').forEach(b => { b.hidden = vis.indexOf(b.dataset.tab) < 0; });
  document.getElementById('bar').classList.toggle('many', vis.length >= 5);
  const cur = document.querySelector('#bar button[aria-selected="true"]');
  if (was && (!cur || vis.indexOf(cur.dataset.tab) < 0)) show(vis[0]);
  return false;
}
async function show(key){
  if (applyMode()) return;
  if (TABS[modeCur].indexOf(key) < 0) key = TABS[modeCur][0];
  const sections = document.querySelectorAll('main > section');
  sections.forEach(s => { s.hidden = (s.id !== 'tab-' + key); });
  document.body.classList.toggle('t-record', key === 'record');
  document.querySelectorAll('#bar button').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === key));
  });
  try { localStorage.setItem(TABKEY, key); } catch(e){}
  const root = document.getElementById('tab-' + key);
  if (!loaded[key]) {
    loaded[key] = true;
    boot.hidden = false;
    boot.innerHTML = '<b>' + ({record:'記録',analysis:'解析',physical:'フィジカル',trackman:'Trackman',session:'セッション記録',me:'マイページ'}[key]) + 'を読み込んでいます…</b>';
    try {
      const m = await import(FILES[key]);
      await m.mount(root, CORE);
      boot.hidden = true;
    } catch (e) {
      loaded[key] = false;
      boot.hidden = false;
      boot.innerHTML = '<b>読み込めませんでした</b>' + String(e && e.message || e) +
        '<br>電波の届くところで開き直してください。';
      return;
    }
  }
  boot.hidden = true;
  root.dispatchEvent(new CustomEvent('hsp:show'));
}

document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (b) show(b.dataset.tab);
});

let first = 'record';
try { const v = localStorage.getItem(TABKEY); if (v && FILES[v]) first = v; } catch(e){}
show(first);
setInterval(applyMode, 2500);
window.addEventListener('focus', applyMode);
/* 開いたまま選手用リンク（#me）に切り替わったとき */
window.addEventListener('hashchange', () => {
  if (location.hash !== '#me') return;
  try { localStorage.setItem(PLINK_KEY, '1'); } catch(e){}
  if (modeNow() !== modeCur) { if (Object.keys(loaded).length) location.reload(); else applyMode(); }
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  /* 新しい版が入ったとき、これまでは「もう一度開き直す」まで古い画面のままだった。
     開いた直後（20秒以内）に入れ替わったときだけ、こちらで1回だけ読み直す。
     試合中など、しばらく使ってからの入れ替わりでは何もしない（次に開いたときに入る）。*/
  const had = !!navigator.serviceWorker.controller;
  let once = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!had || once || performance.now() > 20000) return;
    once = true; location.reload();
  });
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
