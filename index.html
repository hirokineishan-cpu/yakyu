<!-- 起動を早くするための2つ。
     ・前回開いていたタブの部品を、この時点で取りに行かせる（外枠の解析を待たない）
     ・スプレッドシートとの接続も先に張っておく（最初の通信が速くなる） -->
<script>
(function () {
  var t = '';
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('hsp-tab-') === 0) { t = localStorage.getItem(k) || ''; break; }
    }
  } catch (e) {}
  var f = { analysis: 'analysis', physical: 'physical' }[t] || 'record';
  var l = document.createElement('link');
  l.rel = 'modulepreload'; l.href = './mod-' + f + '.js';
  document.head.appendChild(l);
})();
</script>

/* ==== 外枠 ==== */
:root{ --barH:44px }
body{ overflow:hidden }
#bar{
  position:fixed; top:0; left:0; right:0; height:var(--barH); z-index:300;
  display:flex; align-items:stretch; gap:0;
  background:var(--grassDeep); color:#fff;
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 rgba(0,0,0,.18);
}
#bar .tt{
  display:flex; align-items:center; padding:0 12px; font-weight:700; font-size:13px;
  letter-spacing:.04em; white-space:nowrap; opacity:.92;
}
#bar nav{ display:flex; min-width:0 }
#bar button{
  min-width:0; appearance:none; border:0; background:transparent; color:#fff;
  font:inherit; font-size:13.5px; font-weight:600; letter-spacing:.03em;
  padding:0 20px; cursor:pointer; position:relative; opacity:.62;
  border-radius:0; transition:opacity .12s; white-space:nowrap;
}
#bar button:hover{ opacity:.85 }
#bar button[aria-selected="true"]{ opacity:1 }
#bar button[aria-selected="true"]::after{
  content:""; position:absolute; left:10%; right:10%; bottom:0; height:3px;
  background:#fff; border-radius:3px 3px 0 0;
}
#bar button:focus-visible{ outline:2px solid #fff; outline-offset:-3px }
main{ margin-top:calc(var(--barH) + env(safe-area-inset-top)) }
main > section[hidden]{ display:none !important }
#boot{ padding:28px 18px; color:var(--muted); font-size:13px; text-align:center }
#boot b{ display:block; color:var(--ink); font-size:14px; margin-bottom:6px }

@media (max-width:560px){
  #bar .tt{ padding:0 9px; font-size:12px }
  #bar nav{ flex:1 }
  #bar button{ flex:1; padding:0 4px; font-size:12.5px }
}
/* 印刷のときはタブバーを出さない */
@media print{
  #bar{ display:none !important }
  main{ margin-top:0 !important }
  body{ overflow:visible }
}
html.prt #bar{ display:none !important }
html.prt main{ margin-top:0 !important }
html.prt body{ overflow:visible }

<body>

<header id="bar">
  <span class="tt" id="bar-team">野球記録</span>
  <nav role="tablist">
    <button role="tab" data-tab="record"   aria-selected="true">記録</button>
    <button role="tab" data-tab="analysis" aria-selected="false">解析</button>
    <button role="tab" data-tab="physical" aria-selected="false">フィジカル</button>
  </nav>
</header>

<main>
  <section id="tab-record"></section>
  <section id="tab-analysis" hidden></section>
  <section id="tab-physical" hidden></section>
  <div id="boot"><b>読み込んでいます…</b>しばらく待っても変わらないときは、画面を下に引いて更新してください。</div>
</main>

<script type="module">
/* 外枠：設定を配り、タブに応じて部品を読み込むだけ。記録や解析の中身には関与しない。 */
const CFG = {
  TEAM_ID:"aomoriyamada",
  TEAM_NAME:"青森山田高校",
  APP_URL_B64:"aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4RktKYkwyd1pmQngzaGFucmRqUllHSUZVXzczOHFxNndEVkZGWTh3ZFZEc1FveXRtZzAwYUxYNmxHZndSRHVyZ3gvZXhlYw==",
  MIGRATE_LEGACY:true,
  STORE:""            /* 試験中だけ "-t" などを入れて、本番の保存領域と分ける */
};
const CORE = {
  cfg: CFG,
  barH: () => (document.getElementById('bar')?.offsetHeight || 0)
};

const FILES = { record:'./mod-record.js', analysis:'./mod-analysis.js', physical:'./mod-physical.js' };
const TABKEY = 'hsp-tab-' + CFG.TEAM_ID + CFG.STORE;
const loaded = {};
const boot = document.getElementById('boot');
if (CFG.TEAM_NAME) document.getElementById('bar-team').textContent = CFG.TEAM_NAME;

async function show(key){
  const sections = document.querySelectorAll('main > section');
  sections.forEach(s => { s.hidden = (s.id !== 'tab-' + key); });
  document.querySelectorAll('#bar button').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === key));
  });
  try { localStorage.setItem(TABKEY, key); } catch(e){}
  const root = document.getElementById('tab-' + key);
  if (!loaded[key]) {
    loaded[key] = true;
    boot.hidden = false;
    boot.innerHTML = '<b>' + ({record:'記録',analysis:'解析',physical:'フィジカル'}[key]) + 'を読み込んでいます…</b>';
    try {
      const m = await import(FILES[key]);
      await m.mount(root, CORE);
      boot.hidden = true;
    } catch (e) {
      loaded[key] = false;
      boot.hidden = false;
      boot.innerHTML = '<b>読み込めませんでした</b>' + String(e && e.message || e) +
        '<br>電波の届くところで開き直してください。';
      return;
    }
  }
  boot.hidden = true;
  root.dispatchEvent(new CustomEvent('hsp:show'));
}

document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (b) show(b.dataset.tab);
});

let first = 'record';
try { const v = localStorage.getItem(TABKEY); if (v && FILES[v]) first = v; } catch(e){}
show(first);

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
